<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <meta
      name="description"
      content="Turn any Nostr note into a beautifully typeset quote image."
    />
    <meta name="theme-color" content="#08080d" />
    <title>Quotestr — Nostr notes, as beautiful quote images</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT@0,9..144,300..700,0..100;1,9..144,300..700,0..100&family=JetBrains+Mono:wght@400;500&family=Source+Serif+4:ital,opsz,wght@0,8..60,300..700;1,8..60,300..700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="bg-aurora" aria-hidden="true"></div>
    <div class="bg-grain" aria-hidden="true"></div>

    <div class="app">
      <header class="nav">
        <a class="brand" href="/" aria-label="Quotestr home">
          <span class="brand-mark" aria-hidden="true">Q</span>
          <span class="brand-name">quotestr</span>
        </a>

        <div class="nav-links">
          <a
            class="nav-link"
            href="https://nostr.com"
            target="_blank"
            rel="noopener"
            data-label
          >
            <span class="nav-link-text">What is Nostr?</span>
          </a>

          <a
            class="nav-icon"
            href="https://github.com/SamSamskies/quotestr"
            target="_blank"
            rel="noopener"
            aria-label="View source on GitHub"
          >
            <svg
              width="18"
              height="18"
              viewBox="0 0 98 96"
              xmlns="http://www.w3.org/2000/svg"
              aria-hidden="true"
            >
              <path
                fill-rule="evenodd"
                clip-rule="evenodd"
                d="M48.854 0C21.839 0 0 22 0 49.217c0 21.756 13.993 40.172 33.405 46.69 2.427.49 3.316-1.059 3.316-2.362 0-1.141-.08-5.052-.08-9.127-13.59 2.934-16.42-5.867-16.42-5.867-2.184-5.704-5.42-7.17-5.42-7.17-4.448-3.015.324-3.015.324-3.015 4.934.326 7.523 5.052 7.523 5.052 4.367 7.496 11.404 5.378 14.235 4.074.404-3.178 1.699-5.378 3.074-6.6-10.839-1.141-22.243-5.378-22.243-24.283 0-5.378 1.94-9.778 5.014-13.2-.485-1.222-2.184-6.275.486-13.038 0 0 4.125-1.304 13.426 5.052a46.97 46.97 0 0 1 12.214-1.63c4.125 0 8.33.571 12.213 1.63 9.302-6.356 13.427-5.052 13.427-5.052 2.67 6.763.97 11.816.485 13.038 3.155 3.422 5.015 7.822 5.015 13.2 0 18.905-11.404 23.06-22.324 24.283 1.78 1.548 3.316 4.481 3.316 9.126 0 6.6-.08 11.897-.08 13.526 0 1.304.89 2.853 3.316 2.364 19.412-6.52 33.405-24.935 33.405-46.691C97.707 22 75.788 0 48.854 0z"
              />
            </svg>
          </a>

          <button
            class="nav-icon zap-btn"
            data-npub="npub1vp8fdcyejd4pqjyrjk9sgz68vuhq7pyvnzk8j0ehlljvwgp8n6eqsrnpsw"
            title="Send a zap"
            aria-label="Send a zap"
          >
            <span aria-hidden="true">⚡</span>
          </button>
        </div>
      </header>

      <main class="main">
        <section class="hero">
          <p class="eyebrow">Nostr → Quote image</p>
          <h1 class="display">
            Make it <em>a quote.</em>
          </h1>
          <p class="lede">
            Paste any nevent, note ID, npub, or nprofile and get a typeset,
            shareable image — author, quote, and a QR code back to the source.
          </p>
        </section>

        <section class="composer" aria-label="Quote composer">
          <form id="quote-form" class="composer-form" autocomplete="off">
            <label class="field">
              <span class="field-label">Nostr ID</span>
              <input
                id="nostrId"
                class="input"
                type="text"
                name="nostrId"
                placeholder="nevent1…, note1…, npub1…, or nprofile1…"
                spellcheck="false"
                autocapitalize="off"
                autocorrect="off"
                autofocus
              />
            </label>

            <div class="composer-actions">
              <label class="select-field">
                <span class="select-label">Font size</span>
                <select id="font-size-select" class="select">
                  <option value="24" selected>24 px</option>
                  <option value="20">20 px</option>
                  <option value="16">16 px</option>
                  <option value="12">12 px</option>
                </select>
              </label>

              <label class="select-field">
                <span class="select-label">URLs</span>
                <select id="strip-urls-select" class="select" name="stripUrls">
                  <option value="keep" selected>Keep</option>
                  <option value="strip">Strip</option>
                </select>
              </label>

              <label class="select-field">
                <span class="select-label">Metadata</span>
                <select id="metadata-select" class="select" name="showMetadata">
                  <option value="hide">Hide</option>
                  <option value="show" selected>Show</option>
                </select>
              </label>

              <button
                id="generate-button"
                class="btn btn-primary"
                type="submit"
              >
                <span class="btn-label">Generate image</span>
                <svg
                  class="btn-arrow"
                  viewBox="0 0 16 16"
                  fill="none"
                  aria-hidden="true"
                >
                  <path
                    d="M3 8H13M13 8L8.5 3.5M13 8L8.5 12.5"
                    stroke="currentColor"
                    stroke-width="1.75"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  />
                </svg>
              </button>
            </div>
          </form>
        </section>

        <section class="preview" aria-label="Generated preview">
          <div class="preview-frame" data-preview data-state="empty">
            <div class="preview-placeholder">
              <span class="placeholder-mark" aria-hidden="true">&rdquo;</span>
              <span class="loading-ring" aria-hidden="true"></span>
              <p class="placeholder-text">Your quote image will appear here.</p>
              <p class="placeholder-meta">800 × 600+ · PNG</p>
            </div>
            <img id="result-image" src="" alt="Generated quote image" />
          </div>

          <div class="preview-actions">
            <button
              id="upload-button"
              class="btn btn-secondary"
              type="button"
            >
              <span class="btn-label">Upload to nostr.build</span>
            </button>
            <button
              id="create-mp3-button"
              class="btn btn-secondary"
              type="button"
            >
              <span class="btn-label">Create MP3</span>
              <span class="btn-spinner" aria-hidden="true"></span>
            </button>
          </div>

          <div id="mp3-result" class="mp3-result" hidden>
            <div id="mp3-status" class="mp3-status" hidden>
              <span class="mp3-status-spinner" aria-hidden="true"></span>
              <span class="mp3-status-text">Creating MP3…</span>
            </div>
            <audio id="mp3-audio" controls preload="metadata" hidden></audio>
          </div>
        </section>
      </main>

      <footer class="footer">
        <p class="footer-note">Built on <em>Nostr</em></p>
        <p class="footer-note">
          <a
            href="https://github.com/SamSamskies/quotestr"
            target="_blank"
            rel="noopener"
            >Source</a
          >
        </p>
      </footer>
    </div>

    <canvas id="canvas" width="800" height="600" aria-hidden="true"></canvas>

    <script src="https://cdn.jsdelivr.net/npm/nostr-zap@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>
    <script type="module">
      import { bech32 } from "https://cdn.jsdelivr.net/npm/@scure/base@1.1.1/+esm";
      import { uploadFile } from "https://cdn.jsdelivr.net/npm/nostr-build@0.2.1/+esm";
      import Swal from "https://cdn.jsdelivr.net/npm/sweetalert2@11.12.4/+esm";
      import {
        init as initNostrLogin,
        logout as logoutNostrLogin,
      } from "https://cdn.jsdelivr.net/npm/nostr-login@1.5.2/+esm";
      
      const Bech32MaxSize = 5000;
      const NOSTRSTUFF_API_BASE = "https://nostrstuff.vercel.app";
      const QR_SIZE = 120;
      const QR_MARGIN = 2;
      const QR_RENDER_SCALE = 2;
      const QR_CANVAS_PAD = 6;
      const CANVAS_WIDTH = 800;
      const BASE_HEIGHT = 600;
      const METADATA_PAD_X = 24;
      const METADATA_PAD_Y = 14;
      const METADATA_ROW_HEIGHT = 20;
      const METADATA_LABEL_FONT = '500 9px "JetBrains Mono", monospace';
      const METADATA_VALUE_FONT = '400 10px "JetBrains Mono", monospace';
      const defaultNostrichImage = "https://i.nostr.build/jYXRE.jpg";
      const canvas = document.getElementById("canvas");
      const fontSizeSelect = document.getElementById("font-size-select");
      const metadataSelect = document.getElementById("metadata-select");
      const SYNTHESIS_MAX_CODE_POINTS = 4096;
      const uploadButton = document.getElementById("upload-button");
      const createMp3Button = document.getElementById("create-mp3-button");
      const mp3Result = document.getElementById("mp3-result");
      const mp3Status = document.getElementById("mp3-status");
      const mp3Audio = document.getElementById("mp3-audio");
      const resultImage = document.getElementById("result-image");
      const previewFrame = document.querySelector("[data-preview]");
      const generateButton = document.getElementById("generate-button");
      const state = {
        authorName: "",
        authorImageUrl: "",
        quote: "",
        noteUrl: "",
        authorNpub: "",
        postedDate: null,
        nip05: "",
        lud16: "",
        showMetadata: true,
        mp3ObjectUrl: "",
      };

      function hasSynthesisSupport() {
        try {
          return Boolean(
            window.inference?.experimental?.getFeatures?.()?.methods?.synthesize,
          );
        } catch {
          return false;
        }
      }

      function clearMp3Result() {
        if (state.mp3ObjectUrl) {
          URL.revokeObjectURL(state.mp3ObjectUrl);
          state.mp3ObjectUrl = "";
        }
        mp3Audio.removeAttribute("src");
        mp3Audio.load();
        mp3Audio.hidden = true;
        mp3Status.hidden = true;
        mp3Result.hidden = true;
      }

      function setMp3Loading(isLoading) {
        createMp3Button.disabled = isLoading;
        createMp3Button.dataset.loading = isLoading ? "true" : "false";
        createMp3Button.querySelector(".btn-label").textContent = isLoading
          ? "Creating MP3…"
          : "Create MP3";

        if (isLoading) {
          mp3Audio.hidden = true;
          mp3Status.hidden = false;
          mp3Result.hidden = false;
          return;
        }

        mp3Status.hidden = true;
        if (state.mp3ObjectUrl) {
          mp3Audio.hidden = false;
          mp3Result.hidden = false;
        } else {
          mp3Audio.hidden = true;
          mp3Result.hidden = true;
        }
      }

      function showMp3Result(objectUrl) {
        if (state.mp3ObjectUrl) {
          URL.revokeObjectURL(state.mp3ObjectUrl);
        }
        state.mp3ObjectUrl = objectUrl;
        mp3Audio.src = objectUrl;
        mp3Status.hidden = true;
        mp3Audio.hidden = false;
        mp3Result.hidden = false;
      }
      
      if (!window.nostr) {
        initNostrLogin({
          noBanner: false,
          darkMode: true,
          methods: ["connect", "local", "extension"],
        });
      }
      
      function showResult({ showMetadata = false, canvasHeight = BASE_HEIGHT } = {}) {
        resultImage.style.display = "block";
        if (previewFrame) {
          previewFrame.dataset.state = "ready";
          if (showMetadata) {
            previewFrame.style.aspectRatio = `${CANVAS_WIDTH} / ${canvasHeight}`;
            previewFrame.dataset.aspect = "metadata";
          } else {
            previewFrame.style.aspectRatio = "";
            previewFrame.dataset.aspect = "default";
          }
        }
        uploadButton.style.display = "inline-flex";
        createMp3Button.style.display = hasSynthesisSupport()
          ? "inline-flex"
          : "none";
        clearMp3Result();
      }
      
      function setBusy(isBusy) {
        if (!generateButton) return;
        generateButton.disabled = isBusy;
        generateButton.dataset.loading = isBusy ? "true" : "false";
        if (previewFrame && isBusy) previewFrame.dataset.state = "loading";
      }
      
      uploadButton.addEventListener("click", async () => {
        if (!resultImage.src.startsWith("data:image")) {
          return Swal.fire("image has already been uploaded to nostr.build");
        }
      
        canvas.toBlob(async (blob) => {
          const file = new File([blob], "quotestr.png");
          const sign = (event) => window.nostr.signEvent(event);
      
          try {
            uploadButton.disabled = true;
            uploadButton.dataset.loading = "true";
      
            const { nip94_event: nip94Event } = await uploadFile({
              file,
              sign,
            });
            const nostrBuildImgSrc = nip94Event.tags.find(
              (t) => t[0] === "url",
            )?.[1];
      
            if (nostrBuildImgSrc) {
              resultImage.src = nostrBuildImgSrc;
            }
      
            Swal.fire({
              title: "Success",
              text: "You can now right-click the image to copy the nostr.build URL",
              icon: "success",
            });
          } catch (err) {
            if (
              [
                "user rejected",
                "prompt was closed",
                "rejected by user",
              ].includes(err.message.toLowerCase())
            ) {
              return;
            }
      
            logoutNostrLogin();
            Swal.fire({
              title: "Error",
              text: err.message || "Something went wrong :(",
              icon: "error",
            });
          } finally {
            uploadButton.disabled = false;
            uploadButton.dataset.loading = "false";
          }
        }, "image/png");
      });

      createMp3Button.addEventListener("click", async () => {
        if (!hasSynthesisSupport()) {
          return Swal.fire({
            title: "Unavailable",
            text: "Inference Bridge synthesis is not available. Enable Experimental speech in the extension options and reload.",
            icon: "info",
          });
        }

        const text = (state.quote || "").trim();
        if (!text) {
          return Swal.fire({
            title: "Error",
            text: "Generate a quote image first.",
            icon: "error",
          });
        }

        if ([...text].length > SYNTHESIS_MAX_CODE_POINTS) {
          return Swal.fire({
            title: "Quote too long",
            text: `Synthesis supports up to ${SYNTHESIS_MAX_CODE_POINTS.toLocaleString()} characters. Shorten the quote and try again.`,
            icon: "error",
          });
        }

        try {
          setMp3Loading(true);

          const parts = [];
          for await (const chunk of window.inference.experimental.request({
            method: "synthesize",
            text,
          })) {
            if (chunk.type === "audio_delta") parts.push(chunk.data);
          }

          if (!parts.length) {
            throw new Error("No audio was returned from synthesis.");
          }

          const blob = new Blob(parts, { type: "audio/mpeg" });
          showMp3Result(URL.createObjectURL(blob));
        } catch (err) {
          const message = (err?.message || "").toLowerCase();
          if (
            ["permission_denied", "aborted", "user rejected", "prompt was closed"].some(
              (s) => message.includes(s) || err?.code === s,
            )
          ) {
            return;
          }

          Swal.fire({
            title: "Error",
            text: err?.message || "Could not create MP3.",
            icon: "error",
          });
        } finally {
          setMp3Loading(false);
        }
      });
      
      async function imageUrlToBlob(imageUrl) {
        const response = await fetch(imageUrl);
      
        if (!response.ok) {
          throw new Error(`Failed to fetch image: ${response.statusText}`);
        }
      
        return response.blob();
      }
      
      async function loadImage(url) {
        try {
          const blob = await imageUrlToBlob(url);
      
          return new Promise((resolve) => {
            const img = new Image();
            img.onload = () => resolve(img);
            img.src = URL.createObjectURL(blob);
          });
        } catch (err) {
          const blob = await imageUrlToBlob(defaultNostrichImage);
      
          return new Promise((resolve) => {
            const img = new Image();
            img.onload = () => resolve(img);
            img.src = URL.createObjectURL(blob);
          });
        }
      }
      
      function decodeImage(src) {
        return new Promise((resolve, reject) => {
          const img = new Image();
          img.onload = () => resolve(img);
          img.onerror = () => reject(new Error("Failed to decode image"));
          img.src = src;
        });
      }
      
      function drawText(ctx, text, x, y, maxWidth, lineHeight) {
        const words = text.split(" ");
        let line = "";
        let lines = 0;
      
        for (let n = 0; n < words.length; n++) {
          const testLine = line + words[n] + " ";
          const metrics = ctx.measureText(testLine);
          const testWidth = metrics.width;
      
          if (testWidth > maxWidth && n > 0) {
            ctx.fillText(line, x, y);
            line = words[n] + " ";
            y += lineHeight;
            lines++;
          } else {
            line = testLine;
          }
        }
        ctx.fillText(line, x, y);
        lines++;
      
        return lines;
      }
      
      function applyGrayscale(ctx, width, height) {
        const imageData = ctx.getImageData(0, 0, width, height);
        const data = imageData.data;
      
        for (let i = 0; i < data.length; i += 4) {
          const avg = (data[i] + data[i + 1] + data[i + 2]) / 3;
          data[i] = avg;
          data[i + 1] = avg;
          data[i + 2] = avg;
        }
      
        ctx.putImageData(imageData, 0, 0);
      }
      
      async function generateQRCode(text) {
        const renderSize = QR_SIZE * QR_RENDER_SCALE;

        return new Promise((resolve, reject) => {
          QRCode.toDataURL(
            text,
            {
              width: renderSize,
              margin: QR_MARGIN,
              errorCorrectionLevel: getQrErrorCorrectionLevel(text),
            },
            (err, url) => {
              if (err) {
                reject(err);
              } else {
                resolve(url);
              }
            },
          );
        });
      }

      function drawQrOnCanvas(ctx, qrImage, x, y, size) {
        ctx.fillStyle = "#ffffff";
        ctx.fillRect(
          x - QR_CANVAS_PAD,
          y - QR_CANVAS_PAD,
          size + QR_CANVAS_PAD * 2,
          size + QR_CANVAS_PAD * 2,
        );

        const prevSmoothing = ctx.imageSmoothingEnabled;
        ctx.imageSmoothingEnabled = false;
        ctx.drawImage(qrImage, x, y, size, size);
        ctx.imageSmoothingEnabled = prevSmoothing;
      }
      
      async function drawQuoteImage({
        canvas,
        ctx,
        imageUrl,
        author,
        quote,
        noteUrl,
        quoteFontSize,
        showMetadata = true,
        authorNpub = "",
        postedDate = null,
        nip05 = "",
        lud16 = "",
      }) {
        const [image, qrImage] = await Promise.all([
          loadImage(imageUrl),
          decodeImage(await generateQRCode(noteUrl)),
        ]);

        const metadataHeight = showMetadata
          ? measureMetadataHeight({ nip05, lud16 })
          : 0;
        const canvasHeight = showMetadata
          ? BASE_HEIGHT + metadataHeight
          : BASE_HEIGHT;

        canvas.width = CANVAS_WIDTH;
        canvas.height = canvasHeight;

        ctx.fillStyle = "black";
        ctx.fillRect(0, 0, CANVAS_WIDTH, canvasHeight);

        const targetHeight = BASE_HEIGHT;
        const targetWidth = image.width * (targetHeight / image.height);
        const offsetX = (400 - targetWidth) / 2;

        ctx.drawImage(image, offsetX, 0, targetWidth, targetHeight);

        applyGrayscale(ctx, 400, targetHeight);

        ctx.fillStyle = "black";
        ctx.fillRect(400, 0, 400, BASE_HEIGHT);
        ctx.textAlign = "center";
        ctx.font = `${quoteFontSize}px "Source Serif 4", serif`;
        ctx.fillStyle = "white";

        const textX = 600;
        const textY = 120;
        const maxWidth = 360;
        const lineHeight = quoteFontSize + 8;
        const authorFontSize = quoteFontSize * 0.75;

        const quoteLines = quote.split("\n");
        let totalLines = 0;

        quoteLines.forEach((line) => {
          const lines = drawText(
            ctx,
            line,
            textX,
            textY + totalLines * lineHeight,
            maxWidth,
            lineHeight,
          );
          totalLines += lines;
        });

        ctx.font = `italic ${authorFontSize}px "Source Serif 4", serif`;
        ctx.fillStyle = "white";

        drawText(
          ctx,
          `— ${author}`,
          textX,
          totalLines * lineHeight + textY + authorFontSize * 0.5,
          maxWidth,
          lineHeight,
        );

        const qrX = CANVAS_WIDTH - QR_SIZE - 20;
        const qrY = BASE_HEIGHT - QR_SIZE - 20;

        drawQrOnCanvas(ctx, qrImage, qrX, qrY, QR_SIZE);

        if (showMetadata) {
          drawMetadataBar(ctx, {
            y: BASE_HEIGHT,
            height: metadataHeight,
            authorNpub,
            postedDate,
            nip05,
            lud16,
          });
        }

        resultImage.src = canvas.toDataURL("image/png");
        showResult({ showMetadata, canvasHeight });
      }
      
      async function getNote(noteId) {
        try {
          return await fetch(`${NOSTRSTUFF_API_BASE}/api/notes/${noteId}`).then(
            (res) => res.json(),
          );
        } catch (err) {
          return null;
        }
      }
      
      function extractAuthorValues(profile) {
        const defaultName = "Anonymous";
        const defaultValues = {
          author: defaultName,
          imageUrl: defaultNostrichImage,
          about: "",
          nip05: "",
          lud16: "",
        };
      
        if (!profile) {
          return defaultValues;
        }
      
        try {
          const { display_name, displayName, name, picture, about, nip05, lud16 } =
            JSON.parse(profile.content);
      
          return {
            author: display_name || displayName || name || defaultName,
            imageUrl: picture,
            about: about || "",
            nip05: nip05 || "",
            lud16: lud16 || "",
          };
        } catch (err) {
          return defaultValues;
        }
      }
      
      function matchAll(text, regex) {
        const matches = [];
        let match;
      
        while ((match = regex.exec(text)) !== null) {
          matches.push(match[1]);
        }
      
        return matches;
      }
      
      function bytesToHex(bytes) {
        return Array.from(bytes, (byte) =>
          byte.toString(16).padStart(2, "0"),
        ).join("");
      }

      function hexToBytes(hex) {
        const bytes = new Uint8Array(hex.length / 2);

        for (let i = 0; i < bytes.length; i++) {
          bytes[i] = Number.parseInt(hex.slice(i * 2, i * 2 + 2), 16);
        }

        return bytes;
      }

      function encodeNpub(pubkeyHex) {
        const words = bech32.toWords(hexToBytes(pubkeyHex));
        return bech32.encode("npub", words, Bech32MaxSize);
      }

      function formatPostedDate(unixTimestamp) {
        if (!unixTimestamp) {
          return "";
        }

        return new Date(unixTimestamp * 1000).toLocaleDateString("en-US", {
          year: "numeric",
          month: "short",
          day: "numeric",
        });
      }

      function measureMetadataHeight({ nip05 = "", lud16 = "" } = {}) {
        let height = METADATA_PAD_Y * 2 + METADATA_ROW_HEIGHT;

        if (nip05) {
          height += METADATA_ROW_HEIGHT;
        }

        if (lud16) {
          height += METADATA_ROW_HEIGHT;
        }

        return height;
      }

      function drawMetadataBar(
        ctx,
        { y, height, authorNpub, postedDate, nip05, lud16 },
      ) {
        ctx.fillStyle = "#0a0a0a";
        ctx.fillRect(0, y, CANVAS_WIDTH, height);

        ctx.fillStyle = "rgba(255, 255, 255, 0.1)";
        ctx.fillRect(0, y, CANVAS_WIDTH, 1);

        let cursorY = y + METADATA_PAD_Y;
        ctx.textAlign = "left";

        function rowBaseline() {
          return cursorY + METADATA_ROW_HEIGHT - 4;
        }

        ctx.font = METADATA_LABEL_FONT;
        ctx.fillStyle = "rgba(255, 255, 255, 0.35)";
        ctx.fillText("NPUB", METADATA_PAD_X, rowBaseline());

        const npubLabelWidth = ctx.measureText("NPUB").width;

        ctx.font = METADATA_VALUE_FONT;
        ctx.fillStyle = "rgba(255, 255, 255, 0.72)";
        ctx.fillText(
          authorNpub ? `nostr:${authorNpub}` : "—",
          METADATA_PAD_X + npubLabelWidth + 10,
          rowBaseline(),
        );

        ctx.textAlign = "right";
        ctx.fillText(
          formatPostedDate(postedDate),
          CANVAS_WIDTH - METADATA_PAD_X,
          rowBaseline(),
        );
        ctx.textAlign = "left";
        cursorY += METADATA_ROW_HEIGHT;

        function drawLabeledRow(label, value) {
          ctx.font = METADATA_LABEL_FONT;
          ctx.fillStyle = "rgba(255, 255, 255, 0.35)";
          ctx.fillText(label, METADATA_PAD_X, rowBaseline());

          const labelWidth = ctx.measureText(label).width;

          ctx.font = METADATA_VALUE_FONT;
          ctx.fillStyle = "rgba(255, 255, 255, 0.72)";
          ctx.fillText(value, METADATA_PAD_X + labelWidth + 10, rowBaseline());
          cursorY += METADATA_ROW_HEIGHT;
        }

        if (nip05) {
          drawLabeledRow("NIP-05", nip05);
        }

        if (lud16) {
          drawLabeledRow("LIGHTNING ADDRESS", lud16);
        }
      }

      function normalizeNostrId(nostrId) {
        return nostrId
          .trim()
          .replace(/^nostr:/i, "")
          .replace(/^https?:\/\/(?:www\.)?nostr\.com\//i, "");
      }

      function getNostrIdPrefix(nostrId) {
        try {
          return bech32.decode(nostrId, Bech32MaxSize).prefix;
        } catch {
          return null;
        }
      }

      function getQrErrorCorrectionLevel(text) {
        return text.length > 55 ? "L" : "M";
      }
      
      function parseTLV(data) {
        let result = {};
        let rest = data;
        while (rest.length > 0) {
          let t = rest[0];
          let l = rest[1];
          if (!l) throw new Error(`malformed TLV ${t}`);
          let v = rest.slice(2, 2 + l);
          rest = rest.slice(2 + l);
          if (v.length < l)
            throw new Error(`not enough data to read on TLV ${t}`);
          result[t] = result[t] || [];
          result[t].push(v);
        }
        return result;
      }
      
      function decode(nip19Id) {
        let { prefix, words } = bech32.decode(nip19Id, Bech32MaxSize);
        let data = new Uint8Array(bech32.fromWords(words));
      
        switch (prefix) {
          case "nprofile": {
            let tlv = parseTLV(data);
            if (!tlv[0]?.[0]) throw new Error("missing TLV 0 for nprofile");
            if (tlv[0][0].length !== 32)
              throw new Error("TLV 0 should be 32 bytes");
      
            return bytesToHex(tlv[0][0]);
          }
          case "npub":
            return bytesToHex(data);
          default:
            throw new Error(`unknown prefix ${prefix}`);
        }
      }
      
      function extractMentionIds(content) {
        const userIdRegex =
          /(?:nostr:|@)?(npub1[023456789acdefghjklmnpqrstuvwxyz]{58}|nprofile1[023456789acdefghjklmnpqrstuvwxyz]{61,})/g;
      
        return matchAll(content, userIdRegex).map((nip19Id) => ({
          pubkey: decode(nip19Id),
          nip19Id,
        }));
      }
      
      function buildUserProfilesUrl(userIds) {
        const params = new URLSearchParams();
      
        userIds.forEach((item) => {
          params.append("userId", item);
        });
      
        return `${NOSTRSTUFF_API_BASE}/api/users?${params.toString()}`;
      }
      
      async function getUserProfiles(userIds) {
        const url = buildUserProfilesUrl(userIds);
      
        try {
          const profiles = await fetch(url).then((res) => res.json());

          if (!Array.isArray(profiles)) {
            return {};
          }

          return Object.fromEntries(
            profiles.map((item) => [item.pubkey, item]),
          );
        } catch (err) {
          return {};
        }
      }
      
      function getUserName(profile) {
        const { name } = JSON.parse(profile.content);
      
        return name;
      }
      
      function buildMentionIdMap(mentionIds, profiles) {
        const mentionIdMap = {};

        mentionIds.forEach(({ pubkey, nip19Id }) => {
          mentionIdMap[nip19Id] = profiles[pubkey];
        });

        return mentionIdMap;
      }

      async function getMentionProfiles(content, additionalUserIds = []) {
        const mentionIds = extractMentionIds(content);
        const profiles = await getUserProfiles([
          ...additionalUserIds,
          ...mentionIds.map(({ nip19Id }) => nip19Id),
        ]);

        return { mentionIds, profiles };
      }

      function normalizeQuote(content, mentionIdMap, { stripUrls = false } = {}) {
        let result = content;
      
        Object.entries(mentionIdMap).forEach(([nip19Id, profile]) => {
          const re = new RegExp(`(nostr:|@)?${nip19Id}`, "g");
      
          if (profile) {
            result = result.replace(re, `@${getUserName(profile)}`);
          }
        });
      
        if (stripUrls) {
          result = result.replace(/(\n*)https?:\/\/\S+(\n*)/gi, "");
        }
      
        result = result.replace(
          /(\n*)(?:nostr:|@)?(note1[023456789acdefghjklmnpqrstuvwxyz]{58}|nevent1[023456789acdefghjklmnpqrstuvwxyz]{61,})(\n*)/g,
          "",
        );
      
        return result;
      }
      
      function isZapReceiptEvent(event) {
        return event.kind === 9735;
      }
      
      function getZapEvent(event) {
        try {
          return JSON.parse(event.tags.find((t) => t[0] === "description")[1]);
        } catch (err) {
          return null;
        }
      }
      
      function getContent(event) {
        return isZapReceiptEvent(event)
          ? getZapEvent(event).content
          : event.content;
      }
      
      function getAuthorPubkey(event) {
        return isZapReceiptEvent(event)
          ? getZapEvent(event).pubkey
          : event.pubkey;
      }
      
      async function getDataFromEvent(event, { stripUrls = false } = {}) {
        const content = getContent(event);
        const authorPubkey = getAuthorPubkey(event);
        const { mentionIds, profiles } = await getMentionProfiles(content, [
          authorPubkey,
        ]);
        const { author, imageUrl, nip05, lud16 } = extractAuthorValues(
          profiles[authorPubkey],
        );
        const quote = normalizeQuote(
          content,
          buildMentionIdMap(mentionIds, profiles),
          { stripUrls },
        );

        return {
          author,
          imageUrl,
          quote,
          authorPubkey,
          createdAt: event.created_at,
          nip05,
          lud16,
        };
      }

      async function getDataFromProfile(profileId, { stripUrls = false } = {}) {
        const profiles = await getUserProfiles([profileId]);
        const pubkey = decode(profileId);
        const profile = profiles[pubkey] || Object.values(profiles)[0];

        if (!profile) {
          return null;
        }

        const { author, imageUrl, about, nip05, lud16 } =
          extractAuthorValues(profile);
        const { mentionIds, profiles: mentionProfiles } =
          await getMentionProfiles(about);
        const quote = normalizeQuote(
          about,
          buildMentionIdMap(mentionIds, mentionProfiles),
          { stripUrls },
        );

        return {
          author,
          imageUrl,
          quote,
          authorPubkey: pubkey,
          createdAt: null,
          nip05,
          lud16,
        };
      }
      
      function getCtx() {
        return canvas.getContext("2d", { willReadFrequently: true });
      }
      
      document
        .getElementById("quote-form")
        .addEventListener("submit", async (event) => {
          event.preventDefault();
          const formData = new FormData(event.target);
          const nostrId = normalizeNostrId(formData.get("nostrId"));
      
          if (!nostrId) {
            return Swal.fire({
              icon: "error",
              title: "Error",
              text: "Please enter a valid Nostr nevent, note, npub, or nprofile ID.",
            });
          }

          const nostrIdPrefix = getNostrIdPrefix(nostrId);

          if (!nostrIdPrefix) {
            return Swal.fire({
              icon: "error",
              title: "Error",
              text: "Please enter a valid Nostr nevent, note, npub, or nprofile ID.",
            });
          }
      
          setBusy(true);
      
          const ctx = getCtx();
          const stripUrls = formData.get("stripUrls") === "strip";
          const showMetadata = formData.get("showMetadata") === "show";
          let author;
          let imageUrl;
          let quote;
          let authorPubkey;
          let createdAt = null;
          let nip05 = "";
          let lud16 = "";

          if (nostrIdPrefix === "npub" || nostrIdPrefix === "nprofile") {
            const profileData = await getDataFromProfile(nostrId, { stripUrls });

            if (!profileData) {
              setBusy(false);
              if (previewFrame && previewFrame.dataset.state === "loading") {
                previewFrame.dataset.state = resultImage.src ? "ready" : "empty";
              }

              return Swal.fire({
                icon: "error",
                title: "Error",
                text: `Couldn't find Nostr profile with ID ${nostrId}.`,
              });
            }

            ({ author, imageUrl, quote, authorPubkey, createdAt, nip05, lud16 } =
              profileData);

            if (!quote) {
              setBusy(false);
              if (previewFrame && previewFrame.dataset.state === "loading") {
                previewFrame.dataset.state = resultImage.src ? "ready" : "empty";
              }

              return Swal.fire({
                icon: "error",
                title: "Error",
                text: "This profile has no about field to quote.",
              });
            }
          } else if (nostrIdPrefix === "note" || nostrIdPrefix === "nevent") {
            const nostrEvent = await getNote(nostrId);

            if (!nostrEvent) {
              setBusy(false);
              if (previewFrame && previewFrame.dataset.state === "loading") {
                previewFrame.dataset.state = resultImage.src ? "ready" : "empty";
              }

              return Swal.fire({
                icon: "error",
                title: "Error",
                text: `Couldn't find Nostr note with ID ${nostrId}. Contact NotBiebs and tell him this shit sucks.`,
              });
            }

            ({ author, imageUrl, quote, authorPubkey, createdAt, nip05, lud16 } =
              await getDataFromEvent(nostrEvent, {
                stripUrls,
              }));
          } else {
            setBusy(false);
            if (previewFrame && previewFrame.dataset.state === "loading") {
              previewFrame.dataset.state = resultImage.src ? "ready" : "empty";
            }

            return Swal.fire({
              icon: "error",
              title: "Error",
              text: "Please enter a valid Nostr nevent, note, npub, or nprofile ID.",
            });
          }

          const authorImageUrl = `${NOSTRSTUFF_API_BASE}/api/proxy?url=${imageUrl}`;
          const noteUrl = `https://nostr.com/${nostrId}`;
          const quoteFontSize = Number(fontSizeSelect.value);
          const authorNpub = encodeNpub(authorPubkey);

          await drawQuoteImage({
            canvas,
            ctx,
            imageUrl: authorImageUrl,
            author,
            quote,
            noteUrl,
            quoteFontSize,
            showMetadata,
            authorNpub,
            postedDate: createdAt,
            nip05,
            lud16,
          });

          setBusy(false);

          state.authorName = author;
          state.authorImageUrl = authorImageUrl;
          state.quote = quote;
          state.noteUrl = noteUrl;
          state.authorNpub = authorNpub;
          state.postedDate = createdAt;
          state.nip05 = nip05;
          state.lud16 = lud16;
          state.showMetadata = showMetadata;
        });
      
      function redrawQuoteImage() {
        if (
          !state.authorName ||
          !state.authorImageUrl ||
          !state.quote ||
          !state.noteUrl
        ) {
          return;
        }

        return drawQuoteImage({
          canvas,
          ctx: getCtx(),
          imageUrl: state.authorImageUrl,
          author: state.authorName,
          quote: state.quote,
          noteUrl: state.noteUrl,
          quoteFontSize: Number(fontSizeSelect.value),
          showMetadata: metadataSelect.value === "show",
          authorNpub: state.authorNpub,
          postedDate: state.postedDate,
          nip05: state.nip05,
          lud16: state.lud16,
        });
      }

      fontSizeSelect.addEventListener("change", redrawQuoteImage);
      metadataSelect.addEventListener("change", redrawQuoteImage);
    </script>
  </body>
</html>
